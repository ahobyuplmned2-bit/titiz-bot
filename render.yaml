envVarGroups:
  - name: titiz-followup-settings
    envVars:
      - key: FOLLOWUP_CRON_TOKEN
        generateValue: true

services:
  - type: web
    name: whatsapp-bot-titiz
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 --graceful-timeout 30 --keep-alive 5
    envVars:
      - key: PORT
        value: "10000"
      - fromGroup: titiz-followup-settings

  - type: cron
    name: whatsapp-bot-titiz-followups
    runtime: python
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_followups_cron.py
    envVars:
      - key: TITIZ_WEB_URL
        sync: false
      - fromGroup: titiz-followup-settings
